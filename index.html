<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rechenrunde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: Schulheft auf Kästchenpapier. Eine Ziffer pro Kästchen, Rotstift für Fehler.
   Dunkel = Schultafel mit Kreide. Kinder-Ansicht einspaltig, Lehrer-Ansicht als Übersicht. */
:root {
  --paper: #f6f9fd;
  --sheet: #ffffff;
  --grid: #dbe6f2;
  --grid-strong: #a7bfdb;
  --ink: #16296b;
  --ink-soft: #4b5b8c;
  --accent: #2447c9;
  --on-accent: #ffffff;
  --good: #17754a;
  --good-bg: #dff3e7;
  --bad: #c8322a;
  --bad-bg: #fbe3e0;
  --warn: #8a5a00;
  --warn-bg: #fbefcc;
  --font-display: "Kalam", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #14231f; --sheet: #1b2e29; --grid: #25403a; --grid-strong: #43665c;
    --ink: #eef4ec; --ink-soft: #a9beb4; --accent: #f3d779; --on-accent: #1a2a24;
    --good: #86dca6; --good-bg: #1f4a38; --bad: #ff9d90; --bad-bg: #4d2a27;
    --warn: #f4cf72; --warn-bg: #4a3d17;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #14231f; --sheet: #1b2e29; --grid: #25403a; --grid-strong: #43665c;
  --ink: #eef4ec; --ink-soft: #a9beb4; --accent: #f3d779; --on-accent: #1a2a24;
  --good: #86dca6; --good-bg: #1f4a38; --bad: #ff9d90; --bad-bg: #4d2a27;
  --warn: #f4cf72; --warn-bg: #4a3d17;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { min-height: 100%; }
body {
  margin: 0; min-height: 100%;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px;
  color: var(--ink);
  font: 17px/1.45 var(--font-body);
}
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; text-wrap: balance; }
button, select, textarea, input { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--ink-soft); }
.num { font-variant-numeric: tabular-nums; }

/* Kopfzeile */
.topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  max-width: 1040px; margin: 0 auto; padding: 14px 16px 6px;
}
.brand {
  font: 700 1.9rem/1 var(--font-display); color: var(--ink); text-decoration: none;
  border-bottom: 4px solid var(--accent); padding-bottom: 2px;
}
.topr { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.link { background: none; border: 0; padding: 6px 2px; color: var(--accent); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.conn { display: inline-flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--ink-soft); background: var(--sheet); border: 1px solid var(--grid-strong); border-radius: 999px; padding: 3px 12px; }
.conn i { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-soft); }
.conn.ok i { background: var(--good); }
.conn.off i, .conn.err i { background: var(--bad); }
.conn.wait i { background: var(--warn); }

.wrap { max-width: 1040px; margin: 0 auto; padding: 12px 16px 56px; outline: none; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 50px; padding: 0 22px; border-radius: 8px;
  border: 2px solid var(--ink); background: var(--sheet); color: var(--ink);
  font-weight: 700; font-size: 1.05rem; text-decoration: none; cursor: pointer;
  box-shadow: 0 3px 0 var(--ink); transition: transform .06s, box-shadow .06s;
}
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.big { min-height: 60px; font-size: 1.25rem; padding: 0 30px; }
.btn.small { min-height: 38px; padding: 0 14px; font-size: .92rem; box-shadow: 0 2px 0 var(--ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
.btn.danger { border-color: var(--bad); color: var(--bad); box-shadow: 0 2px 0 var(--bad); }
.btn.danger.armed { background: var(--bad); color: #fff; }

.panel { background: var(--sheet); border: 1.5px solid var(--grid-strong); border-radius: 8px; padding: 18px; box-shadow: 0 3px 0 var(--grid-strong); }
.panel > h2 { font-size: 1.35rem; margin-bottom: 10px; }
.notice { background: var(--warn-bg); color: var(--warn); border: 1.5px solid var(--warn); border-radius: 8px; padding: 10px 14px; font-weight: 700; margin-bottom: 14px; }
.notice.err { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }

.badge {
  display: inline-grid; place-items: center; width: 40px; height: 40px; flex: none;
  border-radius: 50%; background: var(--c, #2f5bd8); color: #fff;
  font: 700 1.3rem/1 var(--font-display); padding-top: 3px;
}

/* Ziffer-pro-Kästchen */
.cells { display: flex; justify-content: center; align-items: center; }
.cell {
  position: relative; width: var(--cell); height: var(--cell); display: grid; place-items: center;
  border: 1.5px solid var(--grid-strong); background: var(--sheet); color: var(--ink);
  font: 700 calc(var(--cell) * .66)/1 var(--font-display); padding-top: calc(var(--cell) * .06);
}
.cell + .cell { margin-left: -1.5px; }
.cell.gap { margin-left: calc(var(--cell) * .3); }
.cell.sign { color: var(--accent); }
.mdot { display: inline-block; width: .3em; height: .3em; border-radius: 50%; background: currentColor; vertical-align: middle; }
.cell .mdot { width: calc(var(--cell) * .15); height: calc(var(--cell) * .15); }
.cell.cur::after {
  content: ""; position: absolute; left: 18%; right: 18%; bottom: 12%; height: 3px; background: var(--accent);
  animation: blink 1s steps(2, jump-none) infinite;
}
@keyframes blink { 50% { opacity: 0; } }
.cells.ok .cell { border-color: var(--good); color: var(--good); background: var(--good-bg); }
.cells.bad .cell { border-color: var(--bad); color: var(--bad); background: var(--bad-bg); }
.cells.bad .cell::before {
  content: ""; position: absolute; left: 8%; right: 8%; top: 50%; height: 3px; background: var(--bad); transform: rotate(-14deg);
}
.cells.right .cell { border-color: var(--good); color: var(--good); background: var(--good-bg); }
.rowlabel { font-weight: 700; color: var(--ink-soft); margin-right: 10px; }

/* Startseite */
.hero { max-width: 640px; margin: 28px auto 0; display: grid; gap: 22px; justify-items: center; text-align: center; --cell: clamp(40px, 11vw, 64px); }
.hero h1 { font-size: clamp(2.4rem, 8vw, 3.6rem); }
.hero p { max-width: 46ch; color: var(--ink-soft); }
.hero .actions { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }

/* Kinder-Ansicht */
.kid { max-width: 720px; margin: 8px auto 0; --cell: clamp(28px, calc((min(100vw, 720px) - 40px) / var(--n, 9)), 64px); }
.kid .h { font-size: 2.1rem; margin: 10px 0 4px; }
.kid .lead { color: var(--ink-soft); margin-bottom: 18px; }
.packname { display: inline-block; margin-bottom: 14px; padding: 4px 14px; border-radius: 999px; background: var(--sheet); border: 1.5px solid var(--grid-strong); font-weight: 700; }
.kids { list-style: none; margin: 0 0 18px; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.kidbtn {
  width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer;
  padding: 10px 14px; min-height: 64px; background: var(--sheet); border: 2px solid var(--ink); border-radius: 10px;
  box-shadow: 0 3px 0 var(--ink); font: 700 1.2rem var(--font-display);
}
.kidbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.kidbtn small { display: block; font: 400 .85rem var(--font-body); color: var(--ink-soft); }
.packbtn { align-items: flex-start; flex-direction: column; gap: 2px; }
.newform { display: grid; gap: 14px; }
.newform label, fieldset legend, .flabel { font-weight: 700; display: block; margin-bottom: 6px; padding: 0; }
input[type="text"], input[type="url"], input[type="number"], select.field, textarea.field, .field {
  width: 100%; min-height: 50px; padding: 8px 14px; border: 2px solid var(--ink); border-radius: 8px;
  background: var(--sheet); color: var(--ink); font: 700 1.1rem var(--font-body);
}
textarea.field { min-height: 90px; font-weight: 400; resize: vertical; }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatch { width: 44px; height: 44px; border-radius: 50%; border: 3px solid transparent; background: var(--c); cursor: pointer; padding: 0; }
.swatch[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 3px var(--sheet), 0 0 0 5px var(--ink); }
fieldset { border: 0; padding: 0; margin: 0 0 20px; min-width: 0; }
.chips { display: flex; gap: 10px; flex-wrap: wrap; }
.chip {
  min-height: 46px; padding: 0 16px; border-radius: 8px; border: 2px solid var(--grid-strong); background: var(--sheet);
  font-weight: 700; font-size: 1rem; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
}
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--accent); color: var(--on-accent); box-shadow: 0 3px 0 var(--ink); }
.panel.hint { margin: 0 0 18px; display: grid; gap: 4px; }

.whoami { display: flex; align-items: center; gap: 10px 14px; justify-content: space-between; flex-wrap: wrap; font-weight: 700; }
.whoami .badge { width: 34px; height: 34px; font-size: 1.1rem; }
.whoami span.name { display: flex; align-items: center; gap: 10px; }
.clock {
  display: inline-flex; align-items: center; gap: 6px; font: 700 1.1rem var(--font-body); font-variant-numeric: tabular-nums;
  background: var(--sheet); border: 1.5px solid var(--grid-strong); border-radius: 999px; padding: 2px 12px;
}
.clock.low { color: var(--bad); border-color: var(--bad); background: var(--bad-bg); }
.prog { display: flex; gap: 4px; list-style: none; padding: 0; margin: 12px 0 22px; }
.prog li { flex: 1 1 0; max-width: 30px; height: 12px; border-radius: 3px; background: var(--grid); border: 1.5px solid var(--grid-strong); }
.prog li.ok { background: var(--good); border-color: var(--good); }
.prog li.bad { background: repeating-linear-gradient(135deg, var(--bad) 0 4px, var(--bad-bg) 4px 7px); border-color: var(--bad); }
.prog li.cur { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); background: var(--sheet); }
.task { display: grid; gap: 10px; justify-items: center; min-height: calc(var(--cell) * 3 + 40px); align-content: start; }
.task .cells { width: 100%; }
.fb { min-height: 44px; display: flex; align-items: center; justify-content: center; margin: 14px 0 6px; font: 700 1.5rem var(--font-display); }
.fb.good { color: var(--good); } .fb.bad { color: var(--bad); }
.fb svg { margin-right: 8px; flex: none; }
.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 360px; margin: 6px auto 0; }
.key {
  min-height: clamp(54px, 9vh, 70px); border-radius: 10px; border: 2px solid var(--ink); background: var(--sheet); color: var(--ink);
  font: 700 1.8rem/1 var(--font-display); cursor: pointer; box-shadow: 0 3px 0 var(--ink); padding-top: 4px;
}
.key:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.key:disabled { opacity: .4; box-shadow: none; cursor: default; }
.key.okkey { background: var(--accent); color: var(--on-accent); font-family: var(--font-body); font-size: 1.25rem; }

.score { font: 700 3.2rem/1 var(--font-display); margin: 6px 0 4px; }
.score small { font-size: 1.4rem; color: var(--ink-soft); }
.page { margin: 18px 0; padding: 14px 16px; }
.page ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 4px 20px; }
.page li { display: flex; align-items: baseline; gap: 8px; padding: 5px 0; border-bottom: 1px dashed var(--grid-strong); font: 700 1.25rem var(--font-display); }
.page li .mark { margin-left: auto; font: 700 1.2rem var(--font-body); }
.page li.ok .mark { color: var(--good); }
.page li.bad .mark { color: var(--bad); }
.page li.open { color: var(--ink-soft); }
del { color: var(--bad); text-decoration-thickness: 3px; }
.fix { color: var(--bad); }
.actions-row { display: flex; gap: 14px; flex-wrap: wrap; }
.cmp { display: grid; gap: 6px; margin: 14px 0; }
.cmp .up { color: var(--good); font-weight: 700; }
.cmp .down { color: var(--bad); font-weight: 700; }
.hist { display: flex; gap: 8px; align-items: flex-end; height: 96px; margin-top: 8px; }
.hist > div { flex: 1 1 0; max-width: 44px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; gap: 4px; font-size: .8rem; color: var(--ink-soft); }
.hist i { display: block; width: 100%; background: var(--grid-strong); border-radius: 4px 4px 0 0; min-height: 3px; }
.hist .now i { background: var(--accent); }
.hist .now { color: var(--ink); font-weight: 700; }

/* Lehrer-Ansicht */
.teacher, .teacher .packlist, .teacher .pack, .teacher .stack, .teacher .rounds, .teacher .inline, .teacher .fgrid, #t-live > div { grid-template-columns: minmax(0, 1fr); }
.teacher { display: grid; gap: 18px; }
.sech { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.sech h2 { font-size: 1.5rem; }
.packlist { display: grid; gap: 12px; }
.pack { border: 1.5px solid var(--grid-strong); border-radius: 8px; padding: 14px; background: var(--sheet); display: grid; gap: 12px; }
.pack.arch { background: transparent; border-style: dashed; }
.pack .phead { display: flex; gap: 12px 20px; justify-content: space-between; flex-wrap: wrap; align-items: flex-start; }
.pack h3 { font-size: 1.35rem; }
.pack .pbtns { display: flex; gap: 8px; flex-wrap: wrap; }
.qrbox { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; border-top: 1.5px dashed var(--grid-strong); padding-top: 14px; }
.qrbox .code { width: 184px; height: 184px; background: #fff; border: 1.5px solid var(--grid-strong); border-radius: 6px; padding: 4px; display: grid; place-items: center; }
.qrbox .code svg { width: 100%; height: 100%; display: block; }
.linkrow { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.linkrow input { flex: 1 1 220px; min-height: 40px; font-size: .9rem; font-weight: 400; }
.fgrid { display: grid; gap: 4px; }
.row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px 20px; margin-bottom: 18px; }
.prev { list-style: none; margin: 8px 0 12px; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; max-height: 190px; overflow: auto; }
.prev li { padding: 2px 10px; border: 1px solid var(--grid-strong); border-radius: 6px; background: var(--paper); font: 700 1.05rem var(--font-display); }
.filters { display: flex; gap: 14px 24px; flex-wrap: wrap; align-items: flex-end; }
.filters .fld { display: grid; gap: 4px; min-width: 190px; flex: 1 1 190px; max-width: 320px; }
.filters .fld label { font-weight: 700; font-size: .9rem; color: var(--ink-soft); }
.filters select.field { min-height: 44px; font-size: 1rem; }
.seg { display: inline-flex; border: 2px solid var(--ink); border-radius: 8px; overflow: hidden; background: var(--sheet); }
.seg button { border: 0; background: transparent; padding: 8px 16px; font-weight: 700; cursor: pointer; min-height: 40px; }
.seg button + button { border-left: 2px solid var(--ink); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 1px 10px; border-radius: 999px; font-size: .8rem; font-weight: 700; border: 1.5px solid var(--grid-strong); background: var(--sheet); color: var(--ink-soft); white-space: nowrap; }
.pill.live { color: var(--accent); border-color: var(--accent); }
.pill.live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.pill.good { color: var(--good); border-color: var(--good); background: var(--good-bg); }
.pill.warn { color: var(--warn); border-color: var(--warn); background: var(--warn-bg); }
.pill.bad { color: var(--bad); border-color: var(--bad); background: var(--bad-bg); }
.band { display: grid; grid-template-columns: repeat(4, 1fr); }
.band > div { padding: 4px 16px; border-left: 2px dashed var(--grid-strong); }
.band > div:first-child { border-left: 0; padding-left: 0; }
.band b { display: block; font: 700 2.1rem/1.1 var(--font-display); }
.band span { color: var(--ink-soft); font-size: .9rem; }
.stack { display: grid; gap: 18px; align-content: start; }
.cols { display: grid; align-items: start; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
.tablewrap { overflow-x: auto; }
table.ov { width: 100%; border-collapse: collapse; min-width: 640px; }
table.ov th, table.ov td { padding: 8px 10px; text-align: left; border-bottom: 1px dashed var(--grid-strong); vertical-align: middle; }
table.ov thead th { font-size: .82rem; color: var(--ink-soft); font-weight: 700; border-bottom: 2px solid var(--grid-strong); }
table.ov tbody th { font-weight: 400; }
table.ov tr.sel { background: var(--grid); }
.rowbtn { display: inline-flex; align-items: center; gap: 10px; background: none; border: 0; padding: 2px; cursor: pointer; font: 700 1.15rem var(--font-display); text-align: left; }
.rowbtn + .pill { margin-left: 8px; }
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
.chartbox h3 { font-size: 1.15rem; margin-bottom: 4px; }
.chartbox svg { width: 100%; height: auto; display: block; overflow: visible; }
.chartbox text { font: 11px var(--font-body); fill: var(--ink-soft); }
.chartbox text.endlbl { fill: var(--ink); font-weight: 700; font-size: 12px; }
.chartbox .grd { stroke: var(--grid); stroke-width: 1; }
.chartbox .axis { stroke: var(--grid-strong); stroke-width: 1; }
.chartbox .ln { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chartbox .area { fill: var(--accent); opacity: .1; }
.chartbox .dot, .spark .dot { fill: var(--accent); stroke: var(--sheet); stroke-width: 2; }
.chartbox .xh { stroke: var(--ink-soft); stroke-width: 1; opacity: 0; }
.chartbox .pt:hover .xh, .chartbox .pt:focus-within .xh { opacity: 1; }
.chartbox .hit { fill: transparent; cursor: crosshair; }
.chartbox .hit:focus { outline: none; }
.chartbox .hit:focus-visible { stroke: var(--accent); stroke-width: 2; }
.spark { display: block; overflow: visible; }
.spark .ln { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
details.tview { margin-top: 12px; }
details.tview summary { cursor: pointer; font-weight: 700; color: var(--accent); }
.tip {
  position: fixed; z-index: 30; pointer-events: none; background: var(--sheet); color: var(--ink); border: 1.5px solid var(--ink);
  border-radius: 6px; padding: 6px 10px; box-shadow: 0 3px 0 var(--grid-strong); max-width: 260px;
}
.tip b { display: block; font-size: 1.05rem; }
.tip span { color: var(--ink-soft); font-size: .85rem; }
.emap { display: grid; grid-template-columns: 22px repeat(9, minmax(0, 1fr)); gap: 3px; max-width: 440px; }
.emap > * { aspect-ratio: 1; display: grid; place-items: center; font-size: .78rem; border-radius: 3px; position: relative; }
.emap .hd { aspect-ratio: auto; font: 700 .95rem var(--font-display); color: var(--ink-soft); }
.emap .c { border: 1px solid var(--grid-strong); background: var(--sheet); color: var(--ink-soft); }
.emap .c.sure { background: var(--good-bg); border-color: var(--good); color: var(--good); font-weight: 700; }
.emap .c.mid { background: var(--warn-bg); border-color: var(--warn); color: var(--warn); font-weight: 700; }
.emap .c.low { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); font-weight: 700; }
.emap .c::after { position: absolute; top: 0; right: 2px; font-size: .6rem; line-height: 1.1; }
.emap .c.sure::after { content: "✓"; } .emap .c.mid::after { content: "~"; } .emap .c.low::after { content: "✗"; }
.legend { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: .85rem; color: var(--ink-soft); margin-top: 10px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; border: 1px solid var(--grid-strong); }
.legend .sure i { background: var(--good-bg); border-color: var(--good); }
.legend .mid i { background: var(--warn-bg); border-color: var(--warn); }
.legend .low i { background: var(--bad-bg); border-color: var(--bad); }
.tricky { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }

/* Linien-Diagramm: eine Reihe, eine Achse, Werte im Tooltip und in der Tabelle */
function lineChart(vals, o) {
  const W = 360, H = 200, L = 46, R = 38, Tp = 16, B = 32, pw = W - L - R, ph = H - Tp - B;
  const x = i => vals.length === 1 ? L + pw / 2 : L + pw * i / (vals.length - 1), y = v => Tp + ph * (1 - v / o.max);
  const bw = Math.max(26, vals.length > 1 ? pw / (vals.length - 1) : 60);

  const pts = vals.map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1)).join(' ');
  const area = vals.length > 1 ? '<polygon class="area" points="' + x(0).toFixed(1) + ',' + y(0) + ' ' + pts + ' ' + x(vals.length - 1).toFixed(1) + ',' + y(0) + '"/>' : '';
  const every = vals.length > 12 ? Math.ceil(vals.length / 10) : 1;
  let marks = '';
  vals.forEach((v, i) => {
    const tip = 'Versuch ' + (i + 1) + '|' + o.fmt(v) + '|' + (o.sub[i] || '');

      '<rect class="hit" tabindex="0" x="' + (x(i) - bw / 2).toFixed(1) + '" y="' + Tp + '" width="' + bw.toFixed(1) + '" height="' + ph + '" data-tip="' + esc(tip) + '" aria-label="' + esc('Versuch ' + (i + 1) + ': ' + o.fmt(v) + (o.sub[i] ? ', ' + o.sub[i] : '')) + '"/></g>';
    if (i % every === 0 || i === vals.length - 1) marks += '<text x="' + x(i).toFixed(1) + '" y="' + (H - 10) + '" text-anchor="middle">' + (i + 1) + '</text>';
  });

    '<text class="endlbl" x="' + (x(last) + 9).toFixed(1) + '" y="' + (y(vals[last]) + 4).toFixed(1) + '">' + esc(o.fmt(vals[last])) + '</text></svg>';

}
function roundHtml(s, att) {
  const st = stats(s.tasks), status = sessionStatus(s), missed = Math.max(0, totalOf(s) - s.tasks.length);
  const rows = s.tasks.map(t => {
    const ok = isOk(t);
    return '<li class="' + (ok ? 'ok' : 'bad') + '"><span class="ex num">' + esc(exprText(t)) + ' = ' + (ok ? esc(fmtN(t.answer)) : '<del>' + (Number.isFinite(t.given) ? esc(fmtN(t.given)) : '?') + '</del> <span class="fix">' + esc(fmtN(t.answer)) + '</span>') + '</span><span class="mk">' + (ok ? '✓' : '✗') + '</span><span class="tm num">' + fmtSec(t.ms) + '</span></li>';
  }).join('');
  const armed = T.armed && T.armed.id === s.id && Date.now() < T.armed.until;
  const title = s.packTitle || (s.ops.length ? s.ops.map(o => OPLABEL[o]).join(', ') + ' · ' + rangeLabel(s.range) : 'Freies Üben');
  return '<details class="round" data-id="' + esc(s.id) + '"' + (T.open.has(s.id) ? ' open' : '') + '><summary data-fk="sum-' + esc(s.id) + '">' + badge(s.kidName, s.kidColor) +
    '<span class="who"><b>' + esc(s.kidName) + '</b><span>' + esc(when(s.startedAt)) + (att.get(s.id) ? ' · Versuch ' + att.get(s.id) : '') + ' · ' + esc(title) + (s.done ? '' : ' · ' + s.tasks.length + ' von ' + totalOf(s)) + '</span></span>' +
    '<span class="sc num">' + st.c + '/' + totalOf(s) + '<small><span class="pill ' + status.c + '">' + status.t + '</span></small></span></summary>' +
    '<div class="body"><p class="muted num" style="margin-top:10px">Gesamtzeit ' + fmtDur(elapsedOf(s)) + (s.limitMin ? ' von ' + s.limitMin + ' Min.' : '') + ' · typisch ' + fmtSec(st.med) + ' pro Aufgabe' + (missed && s.done ? ' · ' + missed + ' nicht beantwortet' : '') + '</p>' +
    (rows ? '<ul class="tasks">' + rows + '</ul>' : '<p class="muted">Noch keine Aufgabe beantwortet.</p>') +
    '<button class="btn small danger' + (armed ? ' armed' : '') + '" data-act="delround" data-id="' + esc(s.id) + '" data-fk="del-' + esc(s.id) + '">' + (armed ? 'Wirklich löschen? Nochmal tippen' : 'Versuch löschen') + '</button></div></details>';
}
function renderLive() {
  const el = $('#t-live'); if (!el || mode !== 'lehrer') return;
  const a = document.activeElement, fk = a && a.dataset ? a.dataset.fk : null, cp = curPack();
  const att = attemptMap(store.sessions);
  const inPack = store.sessions.filter(s => (cp === 'all' || s.packId === cp) && inRange(s));
  const sel = inPack.filter(s => T.kid === 'all' || s.kidId === T.kid);
  const tasks = sel.flatMap(s => s.tasks), st = stats(tasks), doneSel = sel.filter(s => s.done && s.tasks.length);
  let note = '';
  if (dbStatus === 'none') note = '<div class="notice err">Keine Verbindung zu den Daten. Öffne diese Seite angemeldet über claude.ai.</div>';
  else if (!store.sessLoaded && store.sessState === 'slow') note = '<div class="notice">Die Daten sind gerade nicht erreichbar. Die Anzeige kann veraltet sein.</div>';
  else if (store.sessState === 'error') note = '<div class="notice err">Die Daten lassen sich nicht lesen. Prüfe, ob du Zugriff auf diese Seite hast.</div>';
  let body;
  if (!store.sessions.length && store.sessLoaded) body = '<div class="panel empty"><h2>Noch kein Versuch</h2><p>Sobald ein Kind ein Päckchen rechnet, siehst du es hier. Jede Antwort erscheint sofort.</p></div>';
  else {
    const kidName = T.kid !== 'all' ? ((store.kids.get(T.kid) || {}).name || (sel[0] || {}).kidName || 'Kind') : '';
    let detail = '';
    if (T.kid !== 'all') {
      detail = cp === 'all' ? '<section class="panel"><h2>Verlauf von ' + esc(kidName) + '</h2><p class="muted">Wähle oben ein Päckchen, dann siehst du hier, wie sich das Kind verbessert.</p></section>'
        : kidDetail(inPack.filter(s => s.kidId === T.kid && s.done && s.tasks.length).sort((x, y) => x.startedAt - y.startedAt), kidName);
    }
    const avg = doneSel.length ? doneSel.reduce((s, x) => s + elapsedOf(x), 0) / doneSel.length : 0;
    body = '<section class="panel"><h2>Klassenübersicht</h2>' + overviewHtml(inPack) + '</section>' + detail +
      (sel.length ? '<section class="panel"><div class="band"><div><b class="num">' + doneSel.length + '</b><span>beendete Versuche</span></div>' +
        '<div><b class="num">' + (st.pct === null ? '–' : st.pct + ' %') + '</b><span>der Antworten richtig</span></div>' +
        '<div><b class="num">' + (st.n ? fmtSec(st.med) : '–') + '</b><span>typische Zeit pro Aufgabe</span></div>' +
        '<div><b class="num">' + (doneSel.length ? fmtDur(avg) : '–') + '</b><span>Gesamtzeit pro Versuch (Mittel)</span></div></div></section>' +
        (hasEinmaleins(tasks)
          ? '<div class="cols"><div class="stack"><section class="panel"><h2>Knifflige Aufgaben</h2>' + trickyList(tasks) + '</section><section class="panel"><h2>Nach Rechenart</h2>' + opsRow(tasks) + '</section></div>' +
            '<section class="panel"><h2>Einmaleins-Karte</h2><p class="muted" style="margin-bottom:12px">Jedes Feld ist ein Produkt aus Mal- und Geteilt-Aufgaben, zum Beispiel 7 · 8 und 56 : 7.</p>' + einmaleins(tasks) + '</section></div>'
          : '<div class="cols"><section class="panel"><h2>Knifflige Aufgaben</h2>' + trickyList(tasks) + '</section><section class="panel"><h2>Nach Rechenart</h2>' + opsRow(tasks) + '</section></div>') +
        '<section><h2 style="margin:6px 0 10px">Versuche</h2><div class="rounds">' + sel.slice(0, 100).map(s => roundHtml(s, att)).join('') + '</div>' + (sel.length > 100 ? '<p class="muted" style="margin-top:10px">Angezeigt werden die letzten 100 Versuche. Wähle ein Päckchen oder ein Kind, um enger zu filtern.</p>' : '') + '</section>'
        : '<div class="panel empty">Für diese Auswahl gibt es keine Versuche. Ändere oben Päckchen, Kind oder Zeitraum.</div>');
  }
  el.innerHTML = note + '<div style="display:grid;gap:18px">' + body + '</div>';
  if (fk) { const n = el.querySelector('[data-fk="' + fk.replace(/"/g, '') + '"]'); if (n) n.focus({ preventScroll: true }); }
}
function renderManageList() {
  const el = $('#t-kidlist'); if (!el) return;
  const ks = [...store.kids.values()].sort((a, b) => a.name.localeCompare(b.name, 'de'));
  el.innerHTML = ks.length ? ks.map(k => {
    const armed = T.armed && T.armed.id === 'kid-' + k.id && Date.now() < T.armed.until;
    return '<li>' + badge(k.name, k.color) + '<span class="nm">' + esc(k.name) + '</span><button class="btn small danger' + (armed ? ' armed' : '') + '" data-act="delkid" data-id="' + esc(k.id) + '">' + (armed ? 'Wirklich löschen? Nochmal tippen' : 'Kind und alle Versuche löschen') + '</button></li>';
  }).join('') : '<li class="muted">Noch keine Kinder. Sie legen sich selbst an, oder du fügst sie hier hinzu.</li>';
}
function arm(id, redraw) {
  if (T.armed && T.armed.id === id && Date.now() < T.armed.until) { T.armed = null; return true; }
  T.armed = { id, until: Date.now() + 4000 }; redraw();
  setTimeout(() => { if (T.armed && T.armed.id === id && Date.now() >= T.armed.until) { T.armed = null; redraw(); } }, 4100);
  return false;
}
async function deleteWhere(field, value) {
  const snap = await db.collection('sessions').where(field, '==', value).get();
  let ok = true;
  for (const d of snap.docs) { ok = (await dbWrite(() => db.collection('sessions').doc(d.id).delete())) && ok; await sleep(60); }
  return ok;
}
async function deleteRound(id) {
  const ok = await dbWrite(() => db.collection('sessions').doc(id).delete());
  T.open.delete(id); toast(ok ? 'Versuch gelöscht.' : 'Löschen nicht möglich.');
}
async function deleteKid(id) {
  let ok = await deleteWhere('kidId', id);
  if (ok) ok = await dbWrite(() => db.collection('kids').doc(id).delete());
  if (T.kid === id) T.kid = 'all';
  toast(ok ? 'Kind gelöscht.' : 'Löschen nicht vollständig möglich.');
}
async function deletePack(id) {
  let ok = await deleteWhere('packId', id);
  if (ok) ok = await dbWrite(() => db.collection('packs').doc(id).delete());
  if (T.pack === id) T.pack = 'auto';
  if (T.qrOpen === id) T.qrOpen = null;
  toast(ok ? 'Päckchen gelöscht.' : 'Löschen nicht vollständig möglich.');
}

/* QR-Code groß, zum Zeigen im Klassenraum */
let bigOpener = null;
function openBig(id) {
  const url = linkFor(id), p = store.packs.get(id), el = $('#qrbig'); if (!url) return;
  bigOpener = document.activeElement;
  el.innerHTML = '<div class="inner"><h2 style="font-size:2rem">' + esc(p ? p.title : 'Rechenrunde') + '</h2><div class="code">' + qrSvg(url) + '</div><p class="muted">' + (p ? esc(packMeta(p)) : 'Alle laufenden Päckchen') + '</p><button class="btn primary" data-act="closebig" id="bigclose">Schließen</button></div>';
  el.hidden = false; $('#bigclose').focus();
}
function closeBig() {
  const el = $('#qrbig'); if (!el || el.hidden) return;
  el.hidden = true; el.innerHTML = '';
  if (bigOpener && bigOpener.focus) { try { bigOpener.focus(); } catch (e) { /* ignorieren */ } }
}

/* Tooltip für Diagramme */
function showTip(target, x, y) {
  const tip = $('#tip'), parts = (target.dataset.tip || '').split('|');
  tip.replaceChildren();
  const v = document.createElement('b'); v.textContent = parts[1] || '';
  const l = document.createElement('span'); l.textContent = parts[0] + (parts[2] ? ' · ' + parts[2] : '');
  tip.append(v, l); tip.hidden = false;
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.max(8, Math.min(window.innerWidth - r.width - 8, x + 12)) + 'px';
  tip.style.top = Math.max(8, y - r.height - 12) + 'px';
}
const hideTip = () => { $('#tip').hidden = true; };
document.addEventListener('pointermove', e => { const t = e.target; if (t.classList && t.classList.contains('hit')) showTip(t, e.clientX, e.clientY); else hideTip(); });
document.addEventListener('focusin', e => { const t = e.target; if (t.classList && t.classList.contains('hit')) { const r = t.getBoundingClientRect(); showTip(t, r.left + r.width / 2, r.top); } });
document.addEventListener('focusout', hideTip);

/* ---------- Ereignisse ---------- */
document.addEventListener('click', async e => {
  const g = e.target.closest('[data-go]');
  if (g) { e.preventDefault(); go(g.dataset.go); return; }
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const d = b.dataset;
  switch (d.act) {
    case 'kidpack': go('p-' + d.id); break;
    case 'pick': { const k = store.kids.get(d.id); if (k) chooseKid(k); break; }
    case 'newtoggle': K.showNew = true; renderKid(); { const i = $('#newname'); if (i) i.focus(); } break;
    case 'color': K.newColor = d.c; document.querySelectorAll('.swatch').forEach(s => s.setAttribute('aria-pressed', String(s.dataset.c === d.c))); break;
    case 'switch': K.screen = 'pick'; K.kid = null; clearTimeout(K.fbTimer); stopClock(); renderKid(); break;
    case 'start': case 'again': if (K.kid && K.pack) startRound(); break;
    case 'finish': K.screen = 'pick'; K.kid = null; K.history = []; renderKid(); break;
    case 'digit': if (K.phase === 'ask' && K.input.length < 7) { K.input = K.input === '0' ? d.v : K.input + d.v; updateAns(); } break;
    case 'del': if (K.phase === 'ask') { K.input = K.input.slice(0, -1); updateAns(); } break;
    case 'ok': submit(); break;
    case 'next': next(); break;
    case 'frange': T.range = d.r; renderFilters(); renderLive(); break;
    case 'fkid': T.kid = T.kid === d.id ? 'all' : d.id; renderFilters(); renderLive(); break;
    case 'newpack': E.open = true; newPreview(); renderEditor(); { const t = $('#t-editor'); if (t) t.scrollIntoView({ block: 'nearest' }); } break;
    case 'cancelpack': E.open = false; renderEditor(); break;
    case 'emode': E.mode = d.m; newPreview(); renderEditor(); break;
    case 'erange': E.range = +d.r; newPreview(); renderEditor(); break;
    case 'eround': E.rounded = d.v === 'on'; newPreview(); renderEditor(); break;
    case 'reroll': newPreview(); renderEditor(); break;
    case 'savepack': await savePack(); break;
    case 'packqr': T.qrOpen = T.qrOpen === d.id ? null : d.id; renderPacks(); break;
    case 'packsel': T.pack = d.id; T.kid = 'all'; renderFilters(); renderLive(); { const f = $('#t-filters'); if (f) f.scrollIntoView({ block: 'start' }); } break;
    case 'packarch': { const p = store.packs.get(d.id); if (p) { const ok = await dbWrite(() => db.collection('packs').doc(d.id).update({ archived: !p.archived })); toast(ok ? (p.archived ? 'Päckchen wieder geöffnet.' : 'Päckchen beendet. Die Kinder sehen einen Hinweis.') : 'Das hat nicht geklappt.'); } break; }
    case 'delpack': if (arm('pack-' + d.id, renderPacks)) { await deletePack(d.id); renderPacks(); renderFilters(); renderLive(); } break;
    case 'qrbig': openBig(d.id); break;
    case 'closebig': closeBig(); break;
    case 'copyurl': {
      const i = $('#lnk-' + d.id);
      try { await navigator.clipboard.writeText(i ? i.value : ''); toast('Link kopiert.'); }
      catch (err) { if (i) { i.focus(); i.select(); } toast('Kopieren nicht möglich. Der Link ist markiert.'); }
      break;
    }
    case 'delround': if (arm(d.id, renderLive)) await deleteRound(d.id); break;
    case 'delkid': if (arm('kid-' + d.id, renderManageList)) { await deleteKid(d.id); renderManageList(); renderFilters(); renderLive(); } break;
  }
});
document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'newform') {
    const kid = await addKid($('#newname').value, K.newColor);
    if (kid) chooseKid(kid);
  } else if (f.id === 'addkidform') {
    const inp = $('#addkid'), names = [...new Set(inp.value.split(/[,;\n]+/).map(s => s.trim().replace(/\s+/g, ' ').slice(0, 14)).filter(Boolean))];
    if (!names.length) return;
    if (!db || !canWrite) { toast('Dieses Gerät darf nichts speichern.'); return; }
    let n = 0;
    for (const nm of names) {
      if ([...store.kids.values()].some(k => k.name.toLowerCase() === nm.toLowerCase())) continue;
      const used = new Set([...store.kids.values()].map(k => k.color));
      await addKid(nm, COLORS.find(c => !used.has(c)) || COLORS[(store.kids.size + n) % COLORS.length]); n++;
    }
    inp.value = ''; toast(n ? n + (n === 1 ? ' Kind angelegt.' : ' Kinder angelegt.') : 'Diese Namen gibt es schon.');
  } else if (f.id === 'urlform') {
    const v = $('#urlin').value.trim();
    if (/^https:\/\//.test(v)) { lsSet('rr.url', v.split('#')[0].split('?')[0]); T.editUrl = false; renderPacks(); }
    else toast('Bitte den ganzen Link mit https:// einfügen.');
  }
});
document.addEventListener('input', e => { if (e.target.id === 'e-title') E.title = e.target.value.slice(0, 40); });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'e-count') { E.count = Math.max(1, Math.min(MAX_TASKS, Math.round(+t.value || 10))); newPreview(); renderEditor(); }
  else if (t.id === 'e-limit') E.limit = +t.value || 0;
  else if (t.id === 'f-pack') { T.pack = t.value; T.kid = 'all'; renderFilters(); renderLive(); }
  else if (t.id === 'f-kid') { T.kid = t.value; renderLive(); }
});
document.addEventListener('toggle', e => {
  const d = e.target;
  if (d.matches && d.matches('details.round')) { if (d.open) T.open.add(d.dataset.id); else T.open.delete(d.dataset.id); }
  else if (d.id === 't-arch') T.archOpen = d.open;
}, true);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeBig(); return; }
  if (mode !== 'kind' || K.screen !== 'play') return;
  const tg = e.target.tagName;
  if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'BUTTON' || tg === 'SELECT' || e.ctrlKey || e.metaKey || e.altKey) return;
  if (K.phase === 'ask') {
    if (/^[0-9]$/.test(e.key) && K.input.length < 7) { K.input = K.input === '0' ? e.key : K.input + e.key; updateAns(); }
    else if (e.key === 'Backspace') { K.input = K.input.slice(0, -1); updateAns(); }
    else if (e.key === 'Enter') { e.preventDefault(); submit(); }
  } else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); next(); }
});
window.addEventListener('hashchange', () => setRoute(parseHash(location.hash)));

setRoute(parseHash(location.hash));
})();
</script>
